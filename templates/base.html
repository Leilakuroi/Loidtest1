<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweet Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .navbar-brand { font-weight: 700; letter-spacing: -.3px; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.09); border-radius: 10px; }
    .card-header { background: #fff; border-bottom: 1px solid #f0f0f0; border-radius: 10px 10px 0 0 !important; font-size: .95rem; }
    .kw-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #e8f0fe; color: #1a56db; border: 1px solid #bfcffe;
      border-radius: 20px; padding: 2px 10px; font-size: .82rem; font-weight: 500;
    }
    .tweet-cell { max-width: 420px; word-break: break-word; font-size: .9rem; }
    .table > :not(caption) > * > * { padding: .75rem 1rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="bi bi-twitter-x me-1"></i> Tweet Monitor
      </a>
      <div class="navbar-nav ms-auto flex-row gap-2">
        <a class="nav-link px-3 rounded {% if request.endpoint == 'config' %}bg-white bg-opacity-10{% endif %}"
           href="{{ url_for('config') }}">
          <i class="bi bi-gear-fill me-1"></i>Config
        </a>
        <a class="nav-link px-3 rounded {% if request.endpoint == 'results' %}bg-white bg-opacity-10{% endif %}"
           href="{{ url_for('results') }}">
          <i class="bi bi-file-earmark-text-fill me-1"></i>Results
        </a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show mb-3" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
